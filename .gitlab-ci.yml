# =============================================================================
# GitLab CI/CD - Granit Front
# =============================================================================
# Pipeline : quality -> gitlab-security -> test -> build -> publish -> analysis
#
# Variables requises (Settings > CI/CD > Variables) :
#   Aucune — le CI_JOB_TOKEN est utilisé automatiquement pour le registry npm
#
# Variables optionnelles :
#   SONAR_HOST_URL  : URL du serveur SonarQube (ex: https://sonar.digitaldynamics.be)
#   SONAR_TOKEN     : Token d'authentification SonarQube (masked)
# =============================================================================

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  interruptible: true

variables:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  HUSKY: '0'

stages:
  - quality
  - gitlab-security
  - test
  - build
  - publish
  - analysis

# ---------------------------------------------------------------------------
# HIDDEN JOBS
# ---------------------------------------------------------------------------

.node_base:
  image: node:24-bookworm-slim
  tags:
    - docker
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

# ---------------------------------------------------------------------------
# QUALITY
# ---------------------------------------------------------------------------

lint:
  stage: quality
  extends: .node_base
  script:
    - pnpm lint

typecheck:
  stage: quality
  extends: .node_base
  script:
    - pnpm tsc

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------

secret_detection:
  stage: gitlab-security
  before_script: []
  allow_failure: false

sast:
  stage: gitlab-security
  before_script: []

semgrep-sast:
  stage: gitlab-security
  before_script: []
  allow_failure: false
  timeout: 10m

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

test:
  stage: test
  extends: .node_base
  script:
    - pnpm test:coverage --run
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  allow_failure:
    exit_codes: 1
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
      allow_failure: false
    - when: on_success

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------

build:
  stage: build
  extends: .node_base
  script:
    - pnpm build
  artifacts:
    paths:
      - packages/@granit/*/dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# PUBLISH
# ---------------------------------------------------------------------------

publish:
  stage: publish
  image: node:24-bookworm-slim
  tags:
    - docker
  interruptible: false
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - |
      cat > .npmrc <<EOF
      @granit:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    - pnpm -r publish --no-git-checks --access restricted
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ---------------------------------------------------------------------------
# ANALYSIS
# ---------------------------------------------------------------------------

audit:npm:
  stage: analysis
  extends: .node_base
  script:
    - pnpm audit --audit-level moderate 2>&1 | tee audit-report.txt
    - '! grep -qE "^[0-9]+ (moderate|high|critical)" audit-report.txt'
  artifacts:
    when: always
    paths:
      - audit-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
  allow_failure: true

sonarqube:
  stage: analysis
  timeout: 30m
  image:
    name: sonarsource/sonar-scanner-cli
    entrypoint: ['']
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  script:
    - sonar-scanner
      -Dsonar.projectKey=${CI_PROJECT_NAME}
      -Dsonar.projectName="${CI_PROJECT_TITLE}"
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == 'develop' && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == 'main' && $SONAR_HOST_URL && $SONAR_TOKEN
